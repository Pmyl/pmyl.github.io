<style>
.two_columns {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  gap: 1.5rem;
  align-items: start;
  margin: 1.5rem 0;
}

.two-columns > div {
  min-width: 0;
}

@media (max-width: 700px) {
  .two_columns {
    grid-template-columns: 1fr;
  }
}
</style>

{% set parts = body | split(pat="%%%") %}

<div class="two_columns">
  <div>
    {{ parts[0] | trim | markdown | safe }}
  </div>

  <div>
    {{ parts[1] | trim | markdown | safe }}
  </div>
</div>
