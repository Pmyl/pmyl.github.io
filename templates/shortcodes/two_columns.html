<style>
.two_columns {
  display: grid;
  grid-template-columns: minmax(0, {{ left_column | default(value="auto") }}) minmax(0, {{ right_column | default(value="auto") }});
  gap: 1.5rem;
  align-items: center;
}

.two-columns > div {
  min-width: 0;
}

@media (max-width: 768px) {
  .two_columns {
    grid-template-columns: 1fr;
  }
}
</style>

{% set parts = body | split(pat="%%%") %}

<div class="two_columns">
  <div>
    {{ parts[0] | trim | markdown | safe }}
  </div>

  <div>
    {{ parts[1] | trim | markdown | safe }}
  </div>
</div>
